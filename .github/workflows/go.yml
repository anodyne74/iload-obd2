# This workflow will build a golang project and push container to GitHub Container Registry
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Install Cross Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Build
      run: |
        GOOS=linux GOARCH=arm64 CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc go build -o iload-obd2-arm64
        mkdir -p release/{bin,config,static}
        cp iload-obd2-arm64 release/bin/iload-obd2
        cp config.yaml release/config/
        cp -r static/* release/static/
        tar czf release.tar.gz -C release .

    - name: Test
      run: go test -v ./...

    - name: Deploy to Raspberry Pi
      if: github.ref == 'refs/heads/main'
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USERNAME }}
        key: ${{ secrets.PI_SSH_KEY }}
        source: "release.tar.gz,scripts/install.sh"
        target: "/tmp/iload-obd2-deploy"
        
    - name: Install on Raspberry Pi
      if: github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USERNAME }}
        key: ${{ secrets.PI_SSH_KEY }}
        script: |
          cd /tmp/iload-obd2-deploy
          chmod +x scripts/install.sh
          sudo systemctl stop iload-obd2 || true
          sudo mkdir -p /opt/iload-obd2
          sudo tar xzf release.tar.gz -C /opt/iload-obd2
          sudo chown -R $USER:$USER /opt/iload-obd2
          sudo ./scripts/install.sh
          rm -rf /tmp/iload-obd2-deploy
